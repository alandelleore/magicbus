name: Build & Deploy APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: EAS Build
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: cd mobile && eas build --platform android --profile preview --non-interactive --wait

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicbus-apk
          path: mobile/*.apk
          retention-days: 30

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          gh release create "$VERSION" mobile/*.apk --title "MagicBus $VERSION" --generate-notes
